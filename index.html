<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PocketSignal">
<meta name="description" content="محلل إشارات بالمؤشرات الفنية - إشارات فقط، بدون تنفيذ صفقات">
<title>PocketSignal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <span id="pill" class="pill off">● غير متصل</span>
    <span class="brand">PocketSignal</span>
  </header>
  <div id="simbar" class="simbar" hidden>وضع المحاكاة - أسعار تجريبية وليست بيانات سوق حقيقية</div>
  <div class="ticker"><div id="ticker-track" class="ticker-track"></div></div>

  <main id="view"></main>

  <nav class="bottom">
    <button data-tab="signal" class="on"><span>⚡</span>إشارة</button>
    <button data-tab="results"><span>〽</span>النتائج</button>
    <button data-tab="settings"><span>⚙</span>الإعدادات</button>
  </nav>
</div>
<noscript>يحتاج هذا التطبيق إلى تفعيل JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
